[package]
name = "struct-patch"
authors.workspace = true
version.workspace = true
edition.workspace = true
categories.workspace = true
keywords.workspace = true
repository.workspace = true
description.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true

[dependencies]
struct-patch-derive = { version = "=0.12.7", path = "../derive" }
serde = { version = "1", features = ["derive"], optional = true }
ts-rs = { version = "12", optional = true }

[dev-dependencies]
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }
serde_with = "3.9.0"
toml = "1.1"
humantime-serde = "1.1.1"
clap = { version = "4.4.7", features = ["derive"] }
ts-rs = "12"

[features]
default = ["status", "op"]
status = [
    "struct-patch-derive/status"
]
op = [
    "struct-patch-derive/op"
]
merge = [
    "struct-patch-derive/merge"
]

alloc = []
std = ["box", "option"]
box = ["alloc"]
option = []
nesting = [
    "struct-patch-derive/nesting"
]
none_as_default = ["option"]
keep_none = ["option"]
catalyst = [
    "struct-patch-derive/catalyst"
]
unsafe = [
    "struct-patch-derive/unsafe"
]
list = [
    "struct-patch-derive/list",
    "alloc"
]
serde = ["dep:serde"]
# Derive `ts_rs::TS` on `ListPatchOp`. Implies `serde` so the generated
# TypeScript type matches the actual JSON wire shape (internally tagged
# `{"op": ...}`).
ts = ["dep:ts-rs", "serde"]
